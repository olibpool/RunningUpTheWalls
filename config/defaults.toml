[zones]
easy = [0.62, 0.72]
marathon = 0.80
threshold = 0.86
interval = 0.97
repetition = 1.05

[rpe]
recovery = 2.0
easy = 3.0
strides = 3.5
long = 4.0
tempo = 6.0
intervals = 8.0

[progression]
max_weekly_increase = 0.10
cutback_every_n_weeks = 4
cutback_factor = 0.80
max_long_run_share = 0.35
max_long_run_minutes = 195
min_rest_days_per_week = 1

[blocks]
base = 0.40
build = 0.40
peak = 0.20

[race_min_weeks]
5k = 6
10k = 8
half = 10
marathon = 12

[taper_factors]
5k = [0.7]
10k = [0.7]
half = [0.8, 0.6]
marathon = [0.85, 0.7, 0.5]

[peak_weekly_km]
5k = 40
10k = 55
half = 70
marathon = 90

# Smallest peak weekly volume a goal needs; below it the goal is infeasible. Unsourced: review.
[min_peak_weekly_km]
5k = 3.0
10k = 6.0
half = 12.7
marathon = 25.3

[templates]
warmup_min = 10
cooldown_min = 10
tempo_work_min = [15, 40]       # threshold block, grows across build and peak
interval_repeats = [3, 6]
interval_rep_min = [3, 5]
strides_repeats = 6
stride_s = 20
stride_recovery_s = 40
recovery_share_of_easy = 0.6
long_share = [0.28, 0.33]       # long run share of weekly km, grows across build and peak
min_easy_minutes = 20
max_quality_share = 0.25       # cap on one quality session's share of weekly run time

[load_factors]
run_leg = 1.0
football_leg = 1.1
climb_leg = 0.1
climb_finger_power = 1.0
climb_finger_volume = 0.6
climb_finger_technique = 0.3

[climbing_defaults]
power = [7.0, 75]
volume = [5.5, 75]
technique = [4.0, 60]

[availability]
weekday = [["06:30", "08:00"], ["17:30", "21:00"]]
weekend = [["07:00", "13:00"]]
buffer_minutes = 30

[scheduler]
min_hours_between_hard_leg = 48
relaxed_hours_between_hard_leg = 24
min_hours_between_limit_climbs = 48
min_hours_same_day_gap = 6
max_run_volume_reduction = 0.40
quality_gap_target_hours = 72
long_run_weekday_cost = 5
limit_climb_before_long_cost = 3
hard_run_climb_same_day_cost = 4
same_day_climb_cost = 2
same_day_session_cost = 3
adjacent_run_day_cost = 1
climbing_spacing_days = 2
drop_cost_easy = 100
drop_cost_climb = 200
drop_cost_quality = 300
drop_cost_other = 400

[calendar_keywords]
fixed = ["football"]
penalty = ["drinks", "party"]
block = ["holiday", "annual leave", "ooo"]

[continuous]
weekly_increase = 0.05
weeks_ahead = 4
replan_interval_days = 7
chronic_load_weeks = 4
block_cycle = ["aerobic", "threshold", "speed"]
weeks_per_block = 4
retest_every_weeks = 10
retest_distance_m = 5000
acr_low = 0.8
acr_high = 1.3
acr_hold = 1.5
quality_load_share = 0.2

[penalty]
day_of_max_rpe = 4.0
days_after = { "1" = 1, "2" = 1, "3" = 2 }
rhr_delta_bpm = 5

[return_ramp]
short_days = 10
short = [0.8]
medium_days = 28
medium = [0.6, 0.8, 1.0]
long = [0.5, 0.65, 0.8, 0.9, 1.0]
no_quality_weeks_after_long = 2

[minimal_plan]
runs = 3
duration_share = 0.33
credit_leg_factor = 0.8
credit_easy_rpe = 6.0
easy_rpe = 3.0
strides_rpe = 8.0
strides_repeats = 4
stride_duration_s = 20
stride_recovery_s = 60

[time_trial]
warmup_min = 15
cooldown_min = 10
warmup_rpe = 3.0
cooldown_rpe = 3.0
work_rpe = 8.5
estimated_5k_duration_min = 25

[readiness]
rhr_window_days = 28
rhr_min_samples = 7

# ---- Phase 2: ingestion and adaptation (unsourced starting points; tune from use) ----

[default_rpe]                 # used when an activity has no RPE and matches no session
run = 4.0
climb = 5.5
football = 6.5
other = 4.0

[matching]
max_score = 0.6               # day offset (0 or 0.5) + relative duration difference

[illness]
niggle_days = 3
ill_days = 14
return_ramp = [0.7, 0.85]     # weekly multipliers on run load after the window, then 100%

[retest]
quality_runs = 3
faster_by = 0.03              # each run this much faster than target, at or below planned RPE

[heat_pace_penalty_pct]       # [apparent_temp_c, slowdown_fraction]
points = [[15, 0.00], [20, 0.01], [25, 0.03], [28, 0.05], [32, 0.08], [35, 0.12]]
quality_to_easy_above_c = 32
suggest_rest_or_indoor_above_c = 35
days_ahead = 3

[weather]
enabled = false               # set latitude and longitude in config/local.toml, then enable
latitude = 0.0
longitude = 0.0
timeout_s = 10.0

[inbox]
path = "~/runcoach-inbox"

[gcal]
ics_url = ""                  # secret: set RUNCOACH_GCAL__ICS_URL or config/local.toml; never logged
days_back = 7
days_ahead = 28
reschedule_days = 14

[storage]
db_path = "runcoach.db"       # relative to the project root, or absolute (e.g. /var/lib/runcoach/runcoach.db)
backup_dir = "backups"
backup_keep = 14

[export]
backend = "none"              # none | garmin | fit (garmin and fit arrive with Phase 4)
push_horizon_days = 7         # watches hold few workouts; push this many days ahead
