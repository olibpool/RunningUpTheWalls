[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coachal"
version = "0.1.0"
description = "Coachal training planner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.1",
  "pydantic>=2.9.2",
  "httpx>=0.27.0",
  "alembic>=1.14.0",
  "sqlalchemy>=2.0.0",
  "icalendar>=7.3.0",
  "recurring-ical-events>=3.8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "hypothesis>=6.110.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest-httpx>=0.30.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["runcoach"]
warn_unused_configs = true
